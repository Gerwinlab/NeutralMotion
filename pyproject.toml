[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "NeutralMotion"
version = "0.1.0"
description = "A solver for the shuttling problem in Neutral Atom quantum computers."
readme = "README.md"
authors = [
    { name = "Gage Erwin", email = "gnerwin@wisc.edu"}
]
requires-python = ">=3.9"
dependencies = [
    "pint>=0.24",
    "qiskit>=1.0",
    "fast-tsp>=0.1.5",
]

[project.optional-dependencies]
# Concorde (exact TSP) is not on PyPI; installing it compiles Concorde and QSOpt.
# Without it, displacement tours use fast-tsp with a warning.
concorde = [
    "pyconcorde @ git+https://github.com/jvkersch/pyconcorde@a573c1b73244f0dc7cf88ddd18ccfa4c65919974",
]

[project.scripts]
naive_dag = "naive_dag.__main__:main"
naive_n_dag = "naive_n_dag.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
